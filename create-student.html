<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Student | FUMMSA Student Life</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="home">

        <div class="logo-box">
            FUMMSA
        </div>

        <p class="eyebrow">
            CREATE YOUR STUDENT
        </p>

        <h1>
            BUILD YOUR
            <span>IDENTITY.</span>
        </h1>

        <p class="description">
            Choose your faculty and programme,
            then get ready to enter the FUMMSA world.
        </p>


        <div class="student-form">

            <label for="studentName">
                STUDENT NAME
            </label>

            <input
                type="text"
                id="studentName"
                placeholder="Enter your name"
            >


            <label for="username">
                USERNAME
            </label>

            <input
                type="text"
                id="username"
                placeholder="Choose a username"
            >


            <label for="level">
                LEVEL
            </label>

            <select id="level">

                <option value="">
                    Select your level
                </option>

                <option>100 Level</option>
                <option>200 Level</option>
                <option>300 Level</option>
                <option>400 Level</option>
                <option>500 Level</option>
                <option>600 Level</option>

            </select>


            <label for="faculty">
                FACULTY
            </label>

            <select id="faculty">

                <option value="">
                    Select your faculty
                </option>

                <option>
                    Clinical / Basic and Clinical Sciences
                </option>

                <option>
                    Basic Medical Sciences
                </option>

                <option>
                    Allied Health Sciences
                </option>

                <option>
                    Pharmaceutical Sciences
                </option>

                <option>
                    Hospital Management & Health Information
                </option>

                <option>
                    Science and Computing
                </option>

            </select>


            <label for="programme">
                PROGRAMME
            </label>

            <select id="programme">

                <option>
                    Select faculty first
                </option>

            </select>


            <button
    class="main-button"
    type="button"
    id="createStudentButton"
>
    CREATE MY STUDENT
            </button>


            <button
                class="outline-button"
                type="button"
                onclick="location.href='index.html'"
            >
                ← GO BACK
            </button>

        </div>


        <footer>
            FUMMSA STUDENT LIFE • CREATE PROFILE
        </footer>

    </main>
  
<script src="script.js"></script>
  
</body>

</html>
