<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUMMSA Student Life | Level Zones</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 padding:24px 16px;
 background:#090d19;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
 margin-bottom:35px;
}
.brand{font-size:18px;font-weight:800;color:#bba4ff}
a,button{cursor:pointer}
.back{
 color:white;text-decoration:none;
 border:1px solid #454b61;
 padding:10px 14px;border-radius:10px
}
h1{font-size:34px;margin-bottom:8px}
p{color:#aeb7cc;line-height:1.6}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
 gap:14px;margin-top:25px
}
.card{
 background:linear-gradient(145deg,#1c2440,#101525);
 border:1px solid #343c58;
 border-radius:17px;padding:22px 16px;
 min-height:155px;
}
.card h2{font-size:21px;margin:8px 0}
.card p{font-size:13px}
.card button{
 width:100%;padding:11px;border:0;border-radius:9px;
 background:#a990ff;color:#101020;font-weight:bold
}
.status{font-size:12px;color:#bba4ff}
#message{
 display:none;margin-top:22px;padding:18px;
 background:#171f35;border-radius:12px;
 border:1px solid #454b61
}
</style>
</head>

<body>
<header>
 <div class="brand">FUMMSA <span>STUDENT LIFE</span></div>
 <a class="back" href="fummsa-world.html">← World</a>
</header>

<p class="status">YOUR UNIVERSITY • YOUR JOURNEY</p>
<h1>Choose Your Zone.</h1>
<p>Explore your level, discover missions and build your student journey.</p>

<div class="grid" id="zones"></div>

<div id="message"></div>

<script>
const student = JSON.parse(
 localStorage.getItem("fummsaStudent") || "{}"
);

const currentLevel = parseInt(student.level, 10) || 100;

const levels = [100, 200, 300, 400, 500, 600];

const zones = document.getElementById("zones");

levels.forEach(level => {
 const card = document.createElement("div");
 card.className = "card";

 card.innerHTML = `
  <div class="status">STUDENT ZONE</div>
  <h2>${level} Level</h2>
  <p>${level === currentLevel
   ? "Your selected level"
   : "Explore this zone"}</p>
  <button type="button">ENTER ZONE</button>
 `;

 card.querySelector("button").onclick = () => {
  const message = document.getElementById("message");
  message.style.display = "block";

  if (level === currentLevel) {
   message.innerHTML =
    "<strong>Welcome to your " + level +
    " Level Zone!</strong><p>Your zone is ready for us to connect missions and activities.</p>";
  } else {
   message.innerHTML =
    "<strong>" + level +
    " Level Zone</strong><p>This zone is part of our planned university world. More activities will be added as development continues.</p>";
  }

  message.scrollIntoView({behavior:"smooth",block:"nearest"});
 };
 zones.appendChild(card);
});
</script>
</body>
</html>
